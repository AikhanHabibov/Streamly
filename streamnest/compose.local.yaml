services:
  web:
    build: .
    environment:
      APP_ENV: production
      PUBLIC_URL: https://streamly.prod.page
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - streamnest_local:/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
volumes:
  streamnest_local:
