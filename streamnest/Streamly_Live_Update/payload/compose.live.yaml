# Always combine with compose.local.yaml (local) or compose.yaml (your own domain).
services:
  web:
    environment:
      MAX_VIDEO_MB: "2048"
      USER_QUOTA_MB: "20480"
      STREAMLY_INTERNAL_SECRET: ${STREAMLY_INTERNAL_SECRET:?Bitte zuerst das Update installieren}
      STREAMLY_MEDIA_API: http://mediamtx:9997
      STREAMLY_MEDIA_HLS: http://mediamtx:8888
      STREAMLY_RTMP_URL: ${STREAMLY_RTMP_URL:-rtmp://127.0.0.1:1935}
    depends_on:
      mediamtx:
        condition: service_started
  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    command: ["/mediamtx.yml"]
    environment:
      MTX_AUTHHTTPADDRESS: http://streamly:${STREAMLY_INTERNAL_SECRET:?Bitte zuerst das Update installieren}@web:8000/internal/live-auth
    volumes:
      - ./streamly-live/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # Local OBS only. Do not expose unencrypted RTMP on the public internet.
      - "127.0.0.1:1935:1935"
    expose:
      - "8888"
      - "9997"
    mem_limit: 512m
    cpus: 1
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
